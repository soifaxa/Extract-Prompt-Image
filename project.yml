name: ExtractPromptImage
options:
  bundleIdPrefix: com.emilien
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ExtractPromptImage:
    type: application
    platform: macOS
    sources:
      - ExtractPromptImage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilien.ExtractPromptImage
        PRODUCT_NAME: Extract Prompt Image
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Extract Prompt Image
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ExtractPromptImage/ExtractPromptImage.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: ExtractPromptImage/ExtractPromptImage.entitlements
